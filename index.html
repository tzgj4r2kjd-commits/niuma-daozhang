<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛马到账计时器 · 在工位看着钱到账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #dfeefd 0%, #f2f8ff 60%, #eaf3fc 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2e3d4d;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 14px 60px;
  }
  body.overtime { background: linear-gradient(180deg, #fdeaea 0%, #fff3f0 60%, #ffe9e5 100%); }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 26px; letter-spacing: 3px; color: #2e3d4d; }
  header h1 em { font-style: normal; color: #3a86d0; }
  header p { font-size: 12.5px; color: #7e93a6; margin-top: 6px; letter-spacing: 1px; }
  .card {
    width: min(560px, 94vw);
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 16px 44px rgba(58, 110, 168, .14);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .main-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; }
  .badge { font-size: 12px; padding: 4px 12px; border-radius: 999px; color: #fff; background: #3a86d0; letter-spacing: 2px; }
  .badge.fish { background: #4caf7d; }
  .badge.over { background: #e05656; }
  .badge.off { background: #8a97a5; }
  .date { font-size: 12px; color: #8a97a5; }
  .clock { font-size: 22px; color: #5e7080; font-variant-numeric: tabular-nums; text-align: right; padding: 6px 20px 0; }
  .big-wrap { padding: 8px 18px 4px; }
  .big-label { font-size: 13px; color: #7e93a6; letter-spacing: 2px; }
  .big { font-size: clamp(40px, 9vw, 58px); font-weight: 800; color: #2e3d4d; font-variant-numeric: tabular-nums; letter-spacing: 1px; line-height: 1.15; }
  .big .unit { font-size: 22px; font-weight: 600; color: #7e93a6; margin-right: 4px; }
  .rate { font-size: 13px; color: #3a86d0; padding: 0 20px 14px; }
  .rate b { font-variant-numeric: tabular-nums; }
  .prog-wrap { padding: 0 18px 14px; }
  .prog-line { display: flex; justify-content: space-between; font-size: 12px; color: #7e93a6; margin-bottom: 6px; }
  .bar { height: 10px; background: #eaf1f8; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #3a86d0, #6cb0f0); transition: width .5s; }
  body.overtime .bar i { background: linear-gradient(90deg, #e05656, #f08a7a); }
  .month { display: flex; justify-content: space-between; padding: 10px 18px; border-top: 1px dashed #d3e0ec; font-size: 12.5px; color: #5e7080; }
  .month b { color: #2e3d4d; font-variant-numeric: tabular-nums; }
  /* 摸鱼回收器 */
  .sec-title { font-size: 13.5px; font-weight: 700; letter-spacing: 2px; padding: 12px 16px 2px; color: #2e3d4d; }
  .fish-btns { display: flex; gap: 8px; padding: 6px 16px 4px; flex-wrap: wrap; }
  .fish-btns button {
    flex: 1; min-width: 100px; padding: 10px 6px; font-size: 13px; cursor: pointer;
    border: 1.5px solid #bcd6ee; background: #f4faff; color: #3a6ea8; border-radius: 12px;
  }
  .fish-btns button.on { background: #4caf7d; border-color: #4caf7d; color: #fff; }
  .fish-list { padding: 6px 16px 10px; font-size: 12px; color: #5e7080; line-height: 1.9; }
  .fish-list b { color: #4caf7d; font-variant-numeric: tabular-nums; }
  /* 语录 */
  .quote { padding: 2px 16px 12px; font-size: 12px; color: #9aa8b6; font-style: italic; }
  /* 工具行 */
  .tools { width: min(560px, 94vw); display: flex; gap: 10px; flex-wrap: wrap; }
  .tools button {
    padding: 11px 8px; font-size: 13px; cursor: pointer;
    border: 0; border-radius: 14px; background: #fff; color: #3a6ea8;
    box-shadow: 0 6px 18px rgba(58,110,168,.12); letter-spacing: 1px;
  }
  .tools button.gold { color: #b07a1e; background: #fff8e8; }
  .tools button:hover { transform: translateY(-1px); }
  /* 设置弹层 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,44,.45); display: none; align-items: center; justify-content: center; z-index: 20; }
  .mask.open { display: flex; }
  .set-card { width: min(420px, 92vw); background: #fff; border-radius: 16px; padding: 24px; }
  .set-card h3 { font-size: 17px; letter-spacing: 2px; margin-bottom: 14px; }
  .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13.5px; }
  .set-row label { flex: 0 0 110px; color: #5e7080; }
  .set-row input { flex: 1; padding: 9px 12px; border: 1.5px solid #d3e0ec; border-radius: 10px; font-size: 14px; color: #2e3d4d; }
  .set-btn { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 12px; background: #3a86d0; color: #fff; font-size: 15px; cursor: pointer; letter-spacing: 4px; }
  /* 老板屏 */
  #bossScreen { position: fixed; inset: 0; background: #f4f7fa; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
  #bossScreen.open { display: flex; }
  .boss-big { font-size: clamp(48px, 10vw, 90px); font-weight: 800; color: #2e6b3d; letter-spacing: 4px; }
  .boss-line { font-size: 16px; color: #5e7080; margin-top: 14px; letter-spacing: 2px; }
  .boss-tip { position: fixed; bottom: 18px; font-size: 11px; color: #b0bcc8; letter-spacing: 2px; }
  /* 越狱 */
  #jailbreak { position: fixed; inset: 0; background: rgba(15,25,40,.88); z-index: 60; display: none; align-items: center; justify-content: center; flex-direction: column; }
  #jailbreak.open { display: flex; }
  .jb-door { font-size: 72px; animation: jbswing .9s ease; transform-origin: left bottom; }
  @keyframes jbswing { from { transform: perspective(600px) rotateY(0); } to { transform: perspective(600px) rotateY(78deg); } }
  .jb-t { font-size: clamp(30px, 6vw, 52px); color: #ffd98a; font-weight: 800; letter-spacing: 8px; margin-top: 10px; }
  .jb-s { font-size: 14px; color: rgba(255,244,224,.8); margin-top: 12px; letter-spacing: 3px; }
  @media (max-width: 480px) { header h1 { font-size: 20px; } .clock { font-size: 18px; } }

/* 搬砖工地 */
#brickCard { width: min(560px, 94vw); background: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 44px rgba(58,110,168,.14); margin-bottom: 16px; }
#brickWrap { position: relative; }
#brickCv { display: block; width: 100%; }
.brick-prog { padding: 8px 14px 2px; }
.brick-prog .pl { display: flex; justify-content: space-between; font-size: 12px; color: #7e93a6; margin-bottom: 5px; }
.brick-prog .pl b { color: #2e3d4d; }
.brick-bar { height: 12px; background: #eaf1f8; border-radius: 999px; overflow: hidden; }
.brick-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(45deg, #e8a13c 0 10px, #f4b860 10px 20px); transition: width .6s; }
.goods-chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px 18px 16px; }
  @media (max-width: 700px) { .goods-chips { grid-template-columns: repeat(3, 1fr); } }
.goods-chip { flex: 1; min-width: 84px; text-align: center; padding: 9px 4px; border-radius: 12px; background: #f0f4f9; border: 1.5px solid #dbe6ef; cursor: default; }
.goods-chip .g-name { font-size: 12px; color: #5e7080; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goods-chip .g-price { font-size: 11px; color: #9aa8b6; margin-top: 2px; }
.goods-chip .g-bar { height: 5px; background: #dfe8f0; border-radius: 99px; margin-top: 6px; overflow: hidden; }
.goods-chip .g-bar i { display: block; height: 100%; width: 0; background: #8a97a5; border-radius: 99px; transition: width .8s; }
.goods-chip.done { background: #fff8e2; border-color: #f2c46a; }
.goods-chip.done .g-name { color: #b07a1e; font-weight: 700; }
.goods-chip.done .g-bar i { background: linear-gradient(90deg, #f2c46a, #e8a13c); }
#gToast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #fff8e2; border: 1.5px solid #f2c46a; color: #8a5a12; font-size: 14px; font-weight: 700; padding: 12px 22px; border-radius: 999px; z-index: 30; opacity: 0; transition: all .5s ease; box-shadow: 0 10px 30px rgba(232,161,60,.3); letter-spacing: 1px; }
#gToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 紧凑双列 */
body { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; padding: 12px 16px 10px; max-width: 1080px; margin: 0 auto; justify-items: stretch; align-items: start; grid-template-areas: "head head" "main fish" "brick brick" "tools tools"; }
header { grid-area: head; }
.cardMain { grid-area: main; }
.cardFish { grid-area: fish; }
#brickCard { grid-area: brick; }
.tools { grid-area: tools; }
header { grid-column: 1 / -1; text-align: left; display: flex; align-items: baseline; gap: 12px; margin-bottom: 0; }
header h1 { font-size: 21px; }
header p { margin-top: 0; }
body > .card:nth-of-type(1) { grid-column: auto; }
.card { width: 100%; margin-bottom: 0; }
.cardMain { grid-column: auto; }
#brickCard { grid-column: 1 / -1; }
#brickCv { height: 150px; }
.goods-chips { grid-template-columns: repeat(6, 1fr); padding: 8px 14px 10px; }
.big { font-size: 42px; }
.clock { font-size: 18px; }
.tools { max-width: 1080px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
/* 小窗极简模式 */
body.miniMode header, body.miniMode .cardFish, body.miniMode #brickCard, body.miniMode .tools { display: none; }
body.miniMode { padding-top: 18px; }
.miniExit { display: none; margin: 12px auto 0; width: calc(100% - 8px); padding: 12px; font-size: 14px; border: 0; border-radius: 14px; background: #fff; color: #3a6ea8; box-shadow: 0 6px 18px rgba(58,110,168,.12); cursor: pointer; letter-spacing: 2px; }
body.miniMode .miniExit { display: block; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-areas: "head" "main" "fish" "brick" "tools"; }
  header { flex-direction: column; gap: 4px; }
  .tools { grid-template-columns: repeat(2, 1fr); }
  .goods-chips { grid-template-columns: repeat(3, 1fr); }
}
</style>

</head>
<body>
<header>
  <h1>牛马<em>到账计时器</em></h1>
  <p>每一秒上班，都在为下班充值 · 数据仅存本地不上传</p>
</header>

<div class="card cardMain">
  <div class="main-head">
    <span class="badge" id="stateBadge">上班中</span>
    <span class="date" id="dateTxt"></span>
  </div>
  <div class="clock" id="clockTxt">--:--:--</div>
  <div class="big-wrap">
    <div class="big-label">今日已赚</div>
    <div class="big"><span class="unit">¥</span><span id="earned">0.0000</span></div>
  </div>
  <div class="rate">到账速率 <b id="rate">0.0000</b> 元/秒 <span id="friTag" style="display:none;color:#b07a1e;font-weight:700">· 周五快乐溢价 ×1.5</span></div>
  <div class="prog-wrap">
    <div class="prog-line"><span id="leftLabel">距离下班</span><b id="leftTime">--:--:--</b></div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="prog-line" style="margin-top:5px"><span>工作进度</span><span id="progPct">0%</span></div>
  </div>
  <div class="month"><span>本月累计（按计薪日折算）</span><b id="monthEarned">¥0.00</b></div>
</div>

<div id="brickCard">
  <div id="brickWrap"><canvas id="brickCv"></canvas></div>
  <div class="brick-prog">
    <div class="pl"><span>🔨 今日搬砖进度</span><b id="brickStat">已搬 0 分 · 砌了 0 块砖</b></div>
    <div class="brick-bar"><i id="brickBar"></i></div>
  </div>
  <div class="goods-chips" id="goodsChips"></div>
</div>
<div class="card cardFish">
  <div class="sec-title">摸鱼回收器 · 白嫖才是真到账</div>
  <div class="fish-btns">
    <button type="button" data-k="lache">带薪拉屎</button>
    <button type="button" data-k="heshui">带薪喝水</button>
    <button type="button" data-k="fadai">带薪发呆</button>
  </div>
  <div class="fish-list" id="fishList">今天还没开始回收，点上面按钮开始计时</div>
  <div class="quote" id="quoteTxt"></div>
</div>

<div class="tools">
  <button type="button" id="setBtn">⚙ 薪资设置</button>
  <button type="button" id="bossBtn" class="gold">😎 老板来了</button>
  <button type="button" id="shareBtn">📸 生成战绩图</button>
  <button type="button" id="widgetBtn">🪟 小窗模式</button>
</div>
<button type="button" class="miniExit" id="miniExitBtn">⛶ 展开完整版</button>
</div>


<div id="gToast"></div>
<div class="mask" id="setMask">
  <div class="set-card">
    <h3>薪资设置（仅存本地）</h3>
    <div class="set-row"><label>税后月薪 ¥</label><input id="inSalary" type="number" placeholder="如 12000"></div>
    <div class="set-row"><label>每月计薪天数</label><input id="inDays" type="number" step="0.5" placeholder="21.75"></div>
    <div class="set-row"><label>上班时间</label><input id="inStart" type="time"></div>
    <div class="set-row"><label>下班时间</label><input id="inEnd" type="time"></div>
    <button class="set-btn" id="saveBtn" type="button">开始到账</button>
  </div>
</div>

<div id="bossScreen">
  <div class="boss-big">100%</div>
  <div class="boss-line">今日工作热爱度 · 饱和度 · 敬业度 全满格</div>
  <div class="boss-tip">老板走后点任意位置退出</div>
</div>

<div id="jailbreak">
  <div class="jb-door">🚪</div>
  <div class="jb-t">越狱成功</div>
  <div class="jb-s">今日充值完毕 · 明天继续当牛马</div>
</div>

<script>
(function () {
  /* ===== 配置与状态 ===== */
  var KEY_CFG = "niuma_cfg", KEY_FISH = "niuma_fish";
  var cfg = null, fish = null, lastDay = null, jailDone = false, jailTimer = null;
  var QUOTES = [
    "上班是为了下班，下班是为了明天上班。",
    "工资到账 3 秒消失术，但到账过程很治愈。",
    "我不是在工作，我是在给自己的下班充值。",
    "牛马的浪漫，就是看着数字一秒一秒变多。",
    "摸鱼不是偷懒，是工资的分期退款。",
    "距离退休还有 XXXX 天，但今天先摸为敬。",
    "老板画的饼越大，我的到账数字越香。",
    "只要我摸鱼够快，焦虑就追不上我。"
  ];
  var FISH_NAMES = { lache: "带薪拉屎", heshui: "带薪喝水", fadai: "带薪发呆" };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  cfg = load(KEY_CFG, null);
  fish = load(KEY_FISH, {});
  function todayKey() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  if (!fish || fish.day !== todayKey()) { fish = { day: todayKey(), items: {}, totalSec: 0 }; save(KEY_FISH, fish); }

  /* ===== 时间解析 ===== */
  function hm(hms) { var p = (hms || "09:00").split(":"); return { h: +p[0], m: +p[1] || 0 }; }
  function minsOf(d) { return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
  function startMin() { var t = hm(cfg.start); return t.h * 60 + t.m; }
  function endMin() { var t = hm(cfg.end); return t.h * 60 + t.m; }
  function perSec() { return cfg.salary / (cfg.days * 8 * 3600); }

  /* ===== 主循环 ===== */
  function tick() {
    if (!cfg) return;
    var now = new Date();
    var nowMin = minsOf(now);
    var s = startMin(), e = endMin();
    var isFri = now.getDay() === 5;
    var mult = isFri ? 1.5 : 1;
    var secRate = perSec() * mult;
    var worked = 0, earned = 0, over = false, before = false;

    if (nowMin < s) { before = true; }
    else if (nowMin <= e) { worked = nowMin - s; earned = worked * 60 * secRate; }
    else { over = true; worked = e - s; earned = worked * 60 * secRate; }

    /* 摸鱼：白嫖 = 摸鱼秒数 × 速率（摸鱼也在计薪） */
    var fishEarn = fish.totalSec * perSec();

    /* 状态 */
    var badge = $("stateBadge");
    if (before) { badge.textContent = "还没上班"; badge.className = "badge off"; }
    else if (over) {
      var overMin = nowMin - e;
      badge.textContent = "加班中 · 老板欠你 ¥" + (overMin * 60 * secRate * 1.5).toFixed(2);
      badge.className = "badge over";
      document.body.classList.add("overtime");
    } else if (fishOn()) { badge.textContent = "摸鱼中"; badge.className = "badge fish"; document.body.classList.remove("overtime"); }
    else { badge.textContent = "上班中"; badge.className = "badge"; document.body.classList.remove("overtime"); }

    /* 数字 */
    $("dateTxt").textContent = now.getFullYear() + "." + pad(now.getMonth() + 1) + "." + pad(now.getDate()) + " 周" + "日一二三四五六"[now.getDay()];
    $("clockTxt").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    $("earned").textContent = (earned + fishEarn).toFixed(4);
    $("rate").textContent = secRate.toFixed(4);
    $("friTag").style.display = isFri ? "inline" : "none";
    $("leftLabel").textContent = over ? "今日已下班" : "距离下班";
    if (before) { $("leftTime").textContent = "还没上班"; $("progBar").style.width = "0%"; $("progPct").textContent = "0%"; }
    else if (over) { $("leftTime").textContent = "自由了（或加班中）"; $("progBar").style.width = "100%"; $("progPct").textContent = "100%"; }
    else {
      var remain = e - nowMin;
      var rh = Math.floor(remain / 60), rm = Math.floor(remain % 60), rs = Math.floor((remain % 1) * 60);
      $("leftTime").textContent = pad(rh) + ":" + pad(rm) + ":" + pad(rs);
      var pct = Math.min(100, worked / (e - s) * 100);
      $("progBar").style.width = pct.toFixed(1) + "%";
      $("progPct").textContent = pct.toFixed(1) + "%";
    }
    /* 本月累计 = 日均 × 本月已过计薪日（周一~五数） */
    var d = new Date();
    var workdays = 0;
    for (var i = 1; i <= now.getDate() - 1; i++) {
      var dw = new Date(d.getFullYear(), d.getMonth(), i).getDay();
      if (dw >= 1 && dw <= 5) workdays++;
    }
    var dayEarn = (e - s) * 60 * perSec() + fish.totalSec * perSec() * 0;
    $("monthEarned").textContent = "¥" + (workdays * dayEarn + (over || worked > 0 ? earned : 0)).toFixed(2);

    /* 语录每小时换 */
    if (lastDay !== todayKey()) {
      lastDay = todayKey(); jailDone = false;
      fish = { day: todayKey(), items: {}, totalSec: 0 }; save(KEY_FISH, fish);
      renderFish();
      jailTimer = null;
    }
    $("quoteTxt").textContent = "「" + QUOTES[now.getHours() % QUOTES.length] + "」";

    /* 越狱 */
    if (!jailDone && over && !jailTimer) {
      jailDone = true;
      var jb = $("jailbreak");
      jb.classList.add("open");
      sndJail();
      jailTimer = setTimeout(function () { jb.classList.remove("open"); }, 4200);
    }
  }

  /* ===== 摸鱼 ===== */
  function fishOn() { for (var k in fish.items) { if (fish.items[k].on) return true; } return false; }
  function renderFish() {
    var html = [], total = 0;
    for (var k in FISH_NAMES) {
      var it = fish.items[k];
      if (!it) continue;
      var sec = it.sec + (it.on ? (Date.now() - it.t0) / 1000 : 0);
      total += sec;
      html.push(FISH_NAMES[k] + " " + Math.floor(sec / 60) + "分" + Math.floor(sec % 60) + "秒 → 白嫖 <b>¥" + (sec * perSec()).toFixed(2) + "</b>" + (it.on ? " <span style='color:#4caf7d'>● 计时中</span>" : ""));
    }
    fish.totalSec = total;
    $("fishList").innerHTML = html.length ? html.join("<br>") + "<br>合计白嫖 <b style='font-size:14px'>¥" + (total * perSec()).toFixed(2) + "</b>" : "今天还没开始回收，点上面按钮开始计时";
    save(KEY_FISH, fish);
  }
  Array.prototype.forEach.call(document.querySelectorAll(".fish-btns button"), function (btn) {
    btn.addEventListener("click", function () {
      if (!cfg) { openSet(); return; }
      var k = btn.getAttribute("data-k");
      var it = fish.items[k] || { sec: 0, on: false, t0: 0 };
      if (it.on) { it.sec += (Date.now() - it.t0) / 1000; it.on = false; btn.classList.remove("on"); }
      else { it.on = true; it.t0 = Date.now(); btn.classList.add("on"); }
      fish.items[k] = it;
      renderFish();
    });
  });

  /* ===== 设置 ===== */
  function openSet() {
    $("inSalary").value = cfg ? cfg.salary : "";
    $("inDays").value = cfg ? cfg.days : 21.75;
    $("inStart").value = cfg ? cfg.start : "09:00";
    $("inEnd").value = cfg ? cfg.end : "18:00";
    $("setMask").classList.add("open");
  }
  $("setBtn").addEventListener("click", openSet);
  $("saveBtn").addEventListener("click", function () {
    var salary = parseFloat($("inSalary").value);
    if (!salary || salary <= 0) { $("inSalary").style.borderColor = "#e05656"; return; }
    cfg = {
      salary: salary,
      days: parseFloat($("inDays").value) || 21.75,
      start: $("inStart").value || "09:00",
      end: $("inEnd").value || "18:00"
    };
    save(KEY_CFG, cfg);
    $("setMask").classList.remove("open");
    tick();
  });

  /* ===== 老板屏 ===== */
  $("bossBtn").addEventListener("click", function () { $("bossScreen").classList.add("open"); });
  $("bossScreen").addEventListener("click", function () { this.classList.remove("open"); });

  /* ===== 越狱音效 ===== */
  function sndJail() {
    try {
      var c = new (window.AudioContext || window.webkitAudioContext)();
      [[523, 0], [659, .12], [784, .24], [1047, .38]].forEach(function (p) {
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle"; o.frequency.value = p[0];
        g.gain.setValueAtTime(.12, c.currentTime + p[1]);
        g.gain.exponentialRampToValueAtTime(.001, c.currentTime + p[1] + .3);
        o.connect(g); g.connect(c.destination);
        o.start(c.currentTime + p[1]); o.stop(c.currentTime + p[1] + .32);
      });
    } catch (e) {}
  }

  /* ===== 战绩图 ===== */
  $("shareBtn").addEventListener("click", function () {
    if (!cfg) { openSet(); return; }
    var now = new Date();
    var cv = document.createElement("canvas");
    cv.width = 800; cv.height = 1000;
    var x = cv.getContext("2d");
    var g = x.createLinearGradient(0, 0, 0, 1000);
    g.addColorStop(0, "#dfeefd"); g.addColorStop(1, "#eaf3fc");
    x.fillStyle = g; x.fillRect(0, 0, 800, 1000);
    x.fillStyle = "#ffffff"; x.beginPath();
    if (x.roundRect) x.roundRect(40, 60, 720, 760, 24); else x.rect(40, 60, 720, 760);
    x.fill();
    x.fillStyle = "#3a86d0"; x.font = "800 40px sans-serif"; x.textAlign = "center";
    x.fillText("牛马到账计时器", 400, 140);
    x.fillStyle = "#8a97a5"; x.font = "24px sans-serif";
    x.fillText($("dateTxt").textContent, 400, 185);
    x.fillStyle = "#7e93a6"; x.font = "26px sans-serif";
    x.fillText("今日已赚", 400, 265);
    x.fillStyle = "#2e3d4d"; x.font = "800 72px sans-serif";
    x.fillText("¥" + $("earned").textContent, 400, 350);
    x.fillStyle = "#3a86d0"; x.font = "26px sans-serif";
    x.fillText("速率 ¥" + $("rate").textContent + " /秒", 400, 405);
    var fishHtml = $("fishList").textContent || "";
    var lines = [];
    for (var k in FISH_NAMES) {
      var it = fish.items[k];
      if (it && (it.sec > 0 || it.on)) {
        var sec = it.sec + (it.on ? (Date.now() - it.t0) / 1000 : 0);
        lines.push(FISH_NAMES[k] + " " + Math.floor(sec / 60) + " 分钟");
      }
    }
    x.fillStyle = "#5e7080"; x.font = "24px sans-serif";
    x.fillText("摸鱼白嫖 ¥" + (fish.totalSec * perSec()).toFixed(2), 400, 470);
    x.font = "20px sans-serif"; x.fillStyle = "#9aa8b6";
    lines.slice(0, 3).forEach(function (l, i) { x.fillText(l, 400, 515 + i * 34); });
    x.fillStyle = "#2e3d4d"; x.font = "30px sans-serif";
    x.fillText("本月累计 " + $("monthEarned").textContent, 400, 680);
    x.fillStyle = "#9aa8b6"; x.font = "22px sans-serif";
    x.fillText("「" + QUOTES[now.getHours() % QUOTES.length] + "」", 400, 740);
    x.fillStyle = "#5e7080"; x.font = "600 28px sans-serif";
    x.fillText("牛马宇宙 · 时薪换算器 & 到账计时器", 400, 900);
    x.fillStyle = "#9aa8b6"; x.font = "18px sans-serif";
    x.fillText("数据纯本地计算 · 打工人自己的账本", 400, 945);
    var a = document.createElement("a");
    a.download = "牛马战绩-" + todayKey() + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
  });

  /* ===== 搬砖工地动画 + 价值兑换 ===== */
  var GOODS = [
    { name: '大水', price: 2, u: '瓶' },
    { name: '冰阔乐', price: 3, u: '瓶' },
    { name: '瑞幸', price: 9.9, u: '杯' },
    { name: '沙县套餐', price: 18, u: '顿' },
    { name: '螺蛳粉加炸蛋', price: 26, u: '碗' },
    { name: '精酿啤酒', price: 35, u: '杯' },
    { name: '电影票', price: 45, u: '张' },
    { name: '游戏机', price: 2000, u: '台' },
    { name: '猫全年疫苗体检', price: 2800, u: '次' },
    { name: 'iPhone duo', price: 9999, u: '台' },
    { name: '小米SU7', price: 250000, u: '辆' },
    { name: '移民老美', price: 10000000, u: '趟' }
  ];
  var goodsUnlocked = load('niuma_goods_toast', {});
  var chipsEl = document.getElementById('goodsChips');
  var goodsEls = {};
  GOODS.forEach(function (g) {
    var d = document.createElement('div');
    d.className = 'goods-chip';
    d.title = g.name;
    d.innerHTML = '<div class="g-name">' + g.name + '</div><div class="g-price">¥' + g.price + '</div><div class="g-bar"><i></i></div>';
    chipsEl.appendChild(d);
    goodsEls[g.name] = d;
  });
  function toastGoods(name, price) {
    var gt = document.getElementById('gToast');
    if (!gt) {
      gt = document.createElement('div');
      gt.id = 'gToast';
      document.body.appendChild(gt);
    }
    var g2 = GOODS.find(function (x) { return x.name === name; });
    gt.textContent = '🔨 已搬出一' + (g2 && g2.u ? g2.u : '份') + name + '的钱！¥' + price + ' 达成';
    gt.classList.add('show');
    setTimeout(function () { gt.classList.remove('show'); }, 3500);
  }
  function updateGoods(earned) {
    GOODS.forEach(function (g) {
      var el = goodsEls[g.name];
      if (!el) return;
      var pct = Math.min(100, earned / g.price * 100);
      el.querySelector('.g-bar i').style.width = pct.toFixed(1) + '%';
      if (earned >= g.price) {
        if (!el.classList.contains('done')) {
          el.classList.add('done');
          el.querySelector('.g-name').textContent = '✓ ' + g.name;
          if (!goodsUnlocked[g.name] && earned < g.price * 1.5) {
            goodsUnlocked[g.name] = todayKey();
            save('niuma_goods_toast', goodsUnlocked);
            toastGoods(g.name, g.price);
          }
        }
      } else {
        el.classList.remove('done');
        el.querySelector('.g-name').textContent = g.name;
      }
    });
  }

  var brickCv = document.getElementById('brickCv');
  var bctx = brickCv.getContext('2d');
  var brickBarEl = document.getElementById('brickBar');
  var brickStatEl = document.getElementById('brickStat');
  var bub = []; /* 到账气泡 */
  var lastBub = 0;

  function drawBrickScene(earned, pct, workMin) {
    var W = brickCv.clientWidth || 560, H = 150;
    if (brickCv.width !== Math.round(W * (window.devicePixelRatio || 1))) {
      brickCv.width = Math.round(W * (window.devicePixelRatio || 1));
      brickCv.height = Math.round(H * (window.devicePixelRatio || 1));
      brickCv.style.height = H + 'px';
    }
    var dpr = brickCv.width / W;
    var x = bctx;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, W, H);
    /* 天空渐变 */
    var sky = x.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#dfeefd'); sky.addColorStop(1, '#f2f8ff');
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    var ground = H - 22;
    /* 背景塔吊 */
    x.strokeStyle = '#b8cbdc'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(W * 0.08, ground); x.lineTo(W * 0.08, H * 0.12); x.lineTo(W * 0.2, H * 0.12); x.stroke();
    x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(W * 0.14, H * 0.12); x.lineTo(W * 0.14, H * 0.3); x.stroke();
    x.strokeStyle = '#c8d9e8';
    x.beginPath(); x.moveTo(W * 0.14, H * 0.3); x.lineTo(W * 0.11, H * 0.34); x.moveTo(W * 0.14, H * 0.3); x.lineTo(W * 0.17, H * 0.34); x.stroke();
    /* 脚手架 */
    x.strokeStyle = '#c8d9e8'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(W * 0.3, ground); x.lineTo(W * 0.3, H * 0.28); x.lineTo(W * 0.38, H * 0.28); x.lineTo(W * 0.38, ground); x.stroke();
    x.beginPath(); x.moveTo(W * 0.3, H * 0.45); x.lineTo(W * 0.38, H * 0.45); x.moveTo(W * 0.3, H * 0.62); x.lineTo(W * 0.38, H * 0.62); x.stroke();
    /* 地面 */
    x.fillStyle = '#c7d5e2'; x.fillRect(0, ground, W, H - ground);
    x.fillStyle = '#b3c3d2'; x.fillRect(0, ground, W, 3);
    /* 砖墙：进度% → 砌好的砖 */
    var wallX = W - 150, bw = 30, bh = 15, perRow = 4;
    var doneBricks = Math.floor(pct / 100 * 100); /* 共100块=100% */
    var wallTopY = ground - 15;
    var placed = 0;
    for (var row = 0; row < 25 && placed < doneBricks; row++) {
      for (var col = 0; col < perRow && placed < doneBricks; col++) {
        var bx = wallX + col * bw + (row % 2 ? bw / 2 : 0);
        var by = ground - 15 - row * bh;
        x.fillStyle = row % 2 ? '#e0a96d' : '#d69a5e';
        x.fillRect(bx, by, bw - 2, bh - 2);
        x.strokeStyle = 'rgba(140,95,50,.35)'; x.lineWidth = 1;
        x.strokeRect(bx, by, bw - 2, bh - 2);
        placed++;
      }
    }
    /* 墙上小旗 */
    if (doneBricks > 0) {
      var flagX = wallX + Math.min(doneBricks, 100) % 2 * 0 + bw * perRow / 2;
      var topRow = Math.floor(doneBricks / perRow);
      var fy = ground - 15 - topRow * bh;
      x.strokeStyle = '#5e7080'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(flagX, fy); x.lineTo(flagX, fy - 14); x.stroke();
      x.fillStyle = '#e05656'; x.beginPath(); x.moveTo(flagX, fy - 14); x.lineTo(flagX + 10, fy - 11); x.lineTo(flagX, fy - 8); x.closePath(); x.fill();
    }
    /* 小人：从砖堆到墙往返 */
    var now = performance.now();
    var cycle = 6000; /* 一个来回6秒 */
    var ph = (now % cycle) / cycle;
    var legL = Math.sin(now / 130) * 3;
    var manX = W * 0.12 + (W * 0.62 - W * 0.12) * (ph < 0.5 ? ph * 2 : (1 - ph) * 2);
    var manY = ground;
    var dir = ph < 0.5 ? 1 : -1;
    /* 影子 */
    x.fillStyle = 'rgba(40,50,65,.15)';
    x.beginPath(); x.ellipse(manX, manY + 2, 13, 3, 0, 0, 6.29); x.fill();
    /* 腿 */
    x.strokeStyle = '#4a5568'; x.lineWidth = 2.6; x.lineCap = 'round';
    x.beginPath(); x.moveTo(manX - 2, manY - 12); x.lineTo(manX - 2 + legL * dir, manY); x.stroke();
    x.beginPath(); x.moveTo(manX + 2, manY - 12); x.lineTo(manX + 2 - legL * dir, manY); x.stroke();
    /* 身体（工装蓝） */
    x.fillStyle = '#4a7bb5';
    x.beginPath();
    if (x.roundRect) x.roundRect(manX - 7, manY - 26, 14, 15, 4); else x.rect(manX - 7, manY - 26, 14, 15);
    x.fill();
    /* 扛的砖（肩上） */
    x.fillStyle = '#d69a5e';
    x.fillRect(manX - 4 + dir * 3, manY - 33, 14, 8);
    x.strokeStyle = 'rgba(140,95,50,.4)'; x.lineWidth = 1;
    x.strokeRect(manX - 4 + dir * 3, manY - 33, 14, 8);
    /* 手臂 */
    x.strokeStyle = '#4a7bb5'; x.lineWidth = 2.2;
    x.beginPath(); x.moveTo(manX + dir * 5, manY - 22); x.lineTo(manX + dir * 8, manY - 30); x.stroke();
    /* 头（肤色）+ 安全帽 */
    x.fillStyle = '#ffd9b3';
    x.beginPath(); x.arc(manX + dir * 1, manY - 32, 5.2, 0, 6.29); x.fill();
    x.fillStyle = '#f2b93c';
    x.beginPath(); x.arc(manX + dir * 1, manY - 33.5, 5.6, 3.14, 0); x.fill();
    x.fillRect(manX + dir * 1 - 6.4, manY - 34.6, 12.8, 2);
    /* 眼睛 */
    x.fillStyle = '#2b2b2b';
    x.beginPath(); x.arc(manX + dir * 2.6, manY - 31.5, .7, 0, 6.29); x.fill();
    /* 汗滴（搬砖辛苦） */
    x.fillStyle = 'rgba(90,150,210,.8)';
    var sw = (now / 900) % 1;
    x.globalAlpha = 1 - sw;
    x.beginPath(); x.ellipse(manX - dir * 6, manY - 36 - sw * 6, 1.1, 1.6, 0, 0, 6.29); x.fill();
    x.globalAlpha = 1;
    /* 到账气泡：每3秒冒一个 */
    if (now - lastBub > 3000) {
      lastBub = now;
      bub.push({ x: manX + dir * 10, y: manY - 40, v: 0.5, txt: '+¥' + (perSec() * 3).toFixed(3) });
    }
    for (var bi = bub.length - 1; bi >= 0; bi--) {
      var b = bub[bi];
      b.y -= b.v; b.v *= 0.99;
      x.globalAlpha = Math.max(0, Math.min(1, b.y / (manY - 90) - 0.1));
      x.fillStyle = '#3a86d0'; x.font = '700 11px sans-serif'; x.textAlign = 'center';
      x.fillText(b.txt, b.x, b.y);
      x.globalAlpha = 1;
      if (b.y < manY - 95) bub.splice(bi, 1);
    }
    x.textAlign = 'left';
  }

  var brickTick = setInterval(function () {
    if (!cfg) return;
    var now = new Date();
    var nowMin = minsOf(now);
    var s = startMin(), e = endMin();
    var pct = 0, workMin = 0;
    if (nowMin >= s && nowMin <= e) { workMin = nowMin - s; pct = workMin / (e - s) * 100; }
    else if (nowMin > e) { pct = 100; workMin = e - s; }
    var earnedToday = workMin * 60 * perSec();
    drawBrickScene(earnedToday, pct, workMin);
    brickBarEl.style.width = Math.min(100, pct).toFixed(1) + '%';
    var doneBricks = Math.floor(pct);
    brickStatEl.textContent = '已搬 ' + Math.floor(workMin / 60) + ' 小时 ' + Math.floor(workMin % 60) + ' 分 · 砌了 ' + doneBricks + ' 块砖';
    updateGoods(earnedToday);
  }, 250);

  renderFish();
  if (!cfg) openSet();

  /* ===== 小窗极简模式 ===== */
  var isMini = new URLSearchParams(location.search).get('mini') === '1';
  if (isMini) document.body.classList.add('miniMode');
  document.getElementById('miniExitBtn').addEventListener('click', function () {
    location.href = location.pathname;
  });

  /* ===== 小窗模式：一键缩到右下角挂件 ===== */
  document.getElementById('widgetBtn').addEventListener('click', function () {
    var w = 380, h = 640;
    var left = Math.max(0, (window.screen.availWidth - w - 10));
    var top = Math.max(0, (window.screen.availHeight - h - 30));
    var win = window.open(location.pathname + '?mini=1', 'niuma_widget', 'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
    if (win) {
      try { win.resizeTo(w, h); win.moveTo(left, top); win.focus(); } catch (e) {}
      this.textContent = '🪟 已在小窗运行';
      var self = this;
      setTimeout(function () { self.textContent = '🪟 小窗模式'; }, 3000);
    } else {
      alert('浏览器拦截了弹窗，请允许弹窗后重试');
    }
  });
  setInterval(tick, 200);
  tick();
})();
</script>
